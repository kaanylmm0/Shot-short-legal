<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShotSort Legal & Support</title>
<meta name="description" content="Privacy Policy, Terms of Use, and support information for ShotSort.">

<style>
:root{
  --bg:#0b1020;
  --card:#141b2f;
  --text:#f5f7fb;
  --muted:#a8b0c3;
  --accent:#7c5cff;
  --accent2:#2ea7ff;
  --border:#27304a;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:linear-gradient(180deg,#0b1020 0%,#10162a 100%);
  color:var(--text);
  line-height:1.65;
}
.container{max-width:900px;margin:0 auto;padding:40px 20px 72px}
.card{
  background:rgba(20,27,47,.94);
  border:1px solid var(--border);
  border-radius:20px;
  padding:28px;
  box-shadow:0 20px 60px rgba(0,0,0,.22);
}
h1,h2,h3{line-height:1.2}
h1{font-size:2.4rem;margin-top:0}
h2{margin-top:2rem;font-size:1.35rem}
p,li{color:#e8ebf3}
.muted{color:var(--muted)}
a{color:#9cc9ff}
.button{
  display:inline-block;
  padding:14px 18px;
  border-radius:14px;
  text-decoration:none;
  font-weight:700;
  margin:8px 10px 0 0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;
}
.button.secondary{
  background:#202842;
  border:1px solid var(--border);
}
.hero{text-align:center;padding:56px 28px}
.badge{
  display:inline-block;
  padding:7px 12px;
  border-radius:999px;
  background:#202842;
  color:#cfd6e8;
  font-size:.9rem;
  margin-bottom:14px
}
hr{border:0;border-top:1px solid var(--border);margin:28px 0}
footer{margin-top:28px;text-align:center;color:var(--muted);font-size:.92rem}
code{background:#202842;padding:2px 6px;border-radius:6px}
ul{padding-left:22px}
.notice{
  border-left:4px solid var(--accent);
  background:#11182b;
  padding:14px 16px;
  border-radius:10px;
}
@media (max-width:600px){
  h1{font-size:2rem}
  .container{padding:24px 14px 48px}
  .card{padding:20px}
}
</style>

</head>
<body>
<div class="container">
  <div class="card hero">
    <div class="badge">ShotSort</div>
    <h1>Legal & Support</h1>
    <p class="muted">Privacy-first screenshot organization and cleanup.</p>
    <a class="button" href="privacy.html">Privacy Policy</a>
    <a class="button secondary" href="terms.html">Terms of Use</a>
    <hr>
    <p><strong>Developer:</strong> Mehmet Kaan Yılmam</p>
    <p><strong>Support:</strong> <a href="mailto:studiolabss0@gmail.com">studiolabss0@gmail.com</a></p>
  </div>
  <footer>© 2026 Mehmet Kaan Yılmam. All rights reserved.</footer>
</div>
</body>
</html>
